# Canonical nginx site config for arshman.techquest.ai (version-controlled).
# Deploy: copy to /etc/nginx/sites-available/arshman.techquest.ai on the droplet,
# then `nginx -t && systemctl reload nginx`.
#
#   /api/  -> FastAPI backend  (PM2 uvicorn, 127.0.0.1:8010) — SSE-aware
#   /      -> React SPA        (PM2 `serve`,  127.0.0.1:8011)

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name arshman.techquest.ai;
    if ($host = arshman.techquest.ai) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arshman.techquest.ai;

    ssl_certificate /etc/letsencrypt/live/arshman.techquest.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arshman.techquest.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers (applied to all responses on this host) ───────────────
    # `always` ensures they are sent on error responses too. Note: nginx
    # add_header does not inherit into a location block that defines its own
    # add_header — none of the locations below set add_header, so these apply
    # site-wide.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # ── API + Server-Sent Events → FastAPI backend ────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: never buffer or cache the stream; keep the connection open
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # ── React SPA → frontend PM2 process ──────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
