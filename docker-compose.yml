services:
  postgres:
    image: postgres:16-alpine
    container_name: sql-agents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arshmank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arshmank}
      POSTGRES_DB: ${POSTGRES_DB:-sql_agents}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sql-agents-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arshmank} -d ${POSTGRES_DB:-sql_agents}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sql-agents-pgdata:
